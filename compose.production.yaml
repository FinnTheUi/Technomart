services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:8080"
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage

  queue:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=90
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    depends_on:
      - web

  scheduler:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command:
      - php
      - artisan
      - schedule:work
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    depends_on:
      - web
